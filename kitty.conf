# =========================================================
# KITTY CONFIGURATION
# Tema: ice blue night (mengikuti wallpaper)
# =========================================================

# ---------------------------------------------------------
# Shell
# ---------------------------------------------------------
shell /usr/bin/zsh

# ---------------------------------------------------------
# Font
# ---------------------------------------------------------
font_family      JetBrainsMono Nerd Font
font_size        11.5

# ---------------------------------------------------------
# Tampilan
# ---------------------------------------------------------
background_opacity      0.88
window_padding_width    12
cursor_shape            beam
confirm_os_window_close 0

# ---------------------------------------------------------
# Warna dasar
# ---------------------------------------------------------
background            #0d1433
foreground            #dbe6ff
cursor                #8fa8f2
selection_background  #2b3a8c
selection_foreground  #ffffff
url_color             #a8c4ff

# ---------------------------------------------------------
# Tab bar
# ---------------------------------------------------------
tab_bar_style             powerline
active_tab_background     #8fa8f2
active_tab_foreground     #0d1433
inactive_tab_background   #1b2658
inactive_tab_foreground   #9aabe0

# ---------------------------------------------------------
# Warna ANSI (normal: 0-7, terang: 8-15)
# ---------------------------------------------------------
color0   #1b2658
color8   #7689c5
color1   #e0626a
color9   #f2829c
color2   #86d6a8
color10  #a8ecc4
color3   #e6c987
color11  #f2dca4
color4   #6f8fee
color12  #a8c4ff
color5   #a99bf2
color13  #bfaeff
color6   #74d6e0
color14  #9aeaf2
color7   #dbe6ff
color15  #f0f5ff
