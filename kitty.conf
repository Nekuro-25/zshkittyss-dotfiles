# =========================================================
# KITTY CONFIGURATION
# Tema: merah gelap + biru es (mengikuti wallpaper)
# =========================================================

# ---------------------------------------------------------
# Shell
# ---------------------------------------------------------
shell /usr/bin/zsh

# ---------------------------------------------------------
# Font
# ---------------------------------------------------------
font_family      JetBrainsMono Nerd Font
font_size        11.5

# ---------------------------------------------------------
# Tampilan
# ---------------------------------------------------------
background_opacity      0.88
window_padding_width    12
cursor_shape            beam
confirm_os_window_close 0

# ---------------------------------------------------------
# Warna dasar
# ---------------------------------------------------------
background            #12060f
foreground            #c9dbe6
cursor                #e0122e
selection_background  #7a1a2e
selection_foreground  #ffffff
url_color             #8fc4dc

# ---------------------------------------------------------
# Tab bar
# ---------------------------------------------------------
tab_bar_style             powerline
active_tab_background     #e0122e
active_tab_foreground     #12060f
inactive_tab_background   #2a0f1e
inactive_tab_foreground   #8a5566

# ---------------------------------------------------------
# Warna ANSI (normal: 0-7, terang: 8-15)
# ---------------------------------------------------------
color0   #1c0a16
color8   #4a2233
color1   #e0122e
color9   #ff3b55
color2   #5fa8a0
color10  #7cc4bb
color3   #c9a26b
color11  #e0bd85
color4   #8fc4dc
color12  #b3dcee
color5   #b0526f
color13  #d06d8c
color6   #6fb5cc
color14  #9fd4e6
color7   #c9dbe6
color15  #ffffff
